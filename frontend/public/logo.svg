<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#041d18"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Glowing Emerald Ambient Ring -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" opacity="0.25" filter="url(#glow)"/>

  <!-- Shield / Crest Shape in Background of Symbol -->
  <path d="M 256,100 L 380,150 C 380,270 256,360 256,360 C 256,360 132,270 132,150 Z" 
        fill="#0f2b24" fill-opacity="0.6" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Upward Trend Chart Bars inside Shield -->
  <!-- Bar 1 -->
  <rect x="190" y="240" width="28" height="60" rx="8" fill="#10b981" opacity="0.6"/>
  <!-- Bar 2 -->
  <rect x="230" y="200" width="28" height="100" rx="8" fill="#10b981" opacity="0.85"/>
  <!-- Bar 3 (Top) -->
  <rect x="270" y="160" width="28" height="140" rx="8" fill="url(#emeraldGrad)"/>

  <!-- Trend Line with Arrow -->
  <path d="M 185,245 L 235,195 L 275,175 L 320,135" fill="none" stroke="#6ee7b7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow Head -->
  <polygon points="328,125 328,145 308,125" fill="#6ee7b7"/>

  <!-- Dynamic S / $ Symbol or Finance Emblem in foreground -->
  <circle cx="256" cy="385" r="45" fill="#090d16" stroke="url(#emeraldGrad)" stroke-width="4" filter="url(#softGlow)"/>
  <text x="256" y="399" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#34d399" text-anchor="middle">$</text>

  <!-- App Name Label at bottom -->
  <text x="256" y="468" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="4" fill="#ffffff" text-anchor="middle">FIN<tspan fill="#10b981">CONTROL</tspan></text>
</svg>
